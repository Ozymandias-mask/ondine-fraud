# =============================================================================
# Ondine Bank - plateforme de données pour la détection de fraude (environnement local)
#
# Démarrage :  python scripts/generate_env.py   (une seule fois : crée .env avec des secrets forts)
#              docker compose up -d
# Profils :    generate (historique), stream (flux + ingestion), orchestration (Airflow),
#              pipelines (ligne de commande)
#
# Principes appliqués :
#  - redondance : Kafka 3 nœuds (réplication 3, min.insync 2), stockage objet répliqué sur 2 volumes ;
#  - sécurité   : secrets hors du code (.env), ports exposés uniquement sur 127.0.0.1,
#                 authentification sur toutes les interfaces, chiffrement des données au repos (S3) ;
#  - exploitabilité : healthchecks, redémarrage automatique, limites mémoire, logs bornés.
# =============================================================================

name: ondine

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Configuration commune des services Airflow (même image que les pipelines).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${PG_AIRFLOW_PASSWORD}@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__CORE__DAGS_FOLDER: /opt/ondine/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Les DAG sont actifs dès leur chargement : la plateforme s'automatise sans intervention.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__PARALLELISM: "6"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__API__EXPOSE_CONFIG: "false"
  # Paramètres des traitements (mêmes secrets et accès que pipelines-cli)
  LANDING_ROOT: /data/landing
  LAKE_ROOT: s3
  S3_ENDPOINT: seaweed-filer:8333
  S3_PIPELINE_ACCESS_KEY: ${S3_PIPELINE_ACCESS_KEY}
  S3_PIPELINE_SECRET_KEY: ${S3_PIPELINE_SECRET_KEY}
  PIPELINE_PG_DSN: postgresql://ingestion_app:${PG_INGESTION_PASSWORD}@postgres:5432/ondine
  PSEUDONYMISATION_KEY: ${PSEUDONYMISATION_KEY}
  PUSHGATEWAY_URL: pushgateway:9091
  DUCKDB_THREADS: "4"
  DUCKDB_MEMORY_LIMIT: 4GB
  LANDING_RETENTION_DAYS: "7"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_TRACKING_USERNAME: ${MLFLOW_SERVICE_USER}
  MLFLOW_TRACKING_PASSWORD: ${MLFLOW_SERVICE_PASSWORD}

x-airflow-common: &airflow-common
  image: ondine/pipelines:local
  build: {context: ., dockerfile: pipelines/Dockerfile}
  profiles: [orchestration]
  restart: unless-stopped
  logging: *default-logging
  networks: [ondine]
  environment: *airflow-env
  volumes:
    - ./pipelines/dags:/opt/ondine/dags:ro
    - ./data:/data
    - airflow-logs:/opt/airflow/logs

x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  restart: unless-stopped
  logging: *default-logging
  networks: [ondine]
  deploy:
    resources:
      limits:
        memory: 1536M
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
    interval: 20s
    timeout: 15s
    retries: 10
    start_period: 40s

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  # Durabilité : un message est acquitté quand il est écrit sur au moins 2 des 3 brokers.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # les topics sont déclarés explicitement (kafka-init)
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"

services:
  # ---------------------------------------------------------------- Kafka (flux temps réel)
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    ports: ["127.0.0.1:9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9093,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9093
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    ports: ["127.0.0.1:9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9094
    volumes: [kafka-3-data:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:4.3.1
    networks: [ondine]
    restart: "no"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    volumes: ["./infra/kafka/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      kafka-1: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      KAFKA_CLUSTERS_0_NAME: ondine-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}

  # ---------------------------------------------------------------- Stockage objet S3 (data lake)
  # SeaweedFS : 1 maître, 2 serveurs de volumes (chaque objet est écrit sur les 2 : réplication "001"),
  # 1 filer qui expose l'API S3 et chiffre les données avant de les écrire (AES-256-GCM).
  seaweed-master:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    command: >
      master -ip=seaweed-master -ip.bind=0.0.0.0 -port=9333 -mdir=/data
      -defaultReplication=001 -volumeSizeLimitMB=1024 -metricsPort=9324
    volumes: [seaweed-master-data:/data]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  seaweed-volume-1:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    command: >
      volume -ip=seaweed-volume-1 -ip.bind=0.0.0.0 -port=8081 -master=seaweed-master:9333
      -dir=/data -max=0 -dataCenter=dc1 -rack=rack1 -minFreeSpace=5 -metricsPort=9325
    volumes: [seaweed-volume-1-data:/data]
    depends_on:
      seaweed-master: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 512M

  seaweed-volume-2:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    command: >
      volume -ip=seaweed-volume-2 -ip.bind=0.0.0.0 -port=8082 -master=seaweed-master:9333
      -dir=/data -max=0 -dataCenter=dc1 -rack=rack1 -minFreeSpace=5 -metricsPort=9325
    volumes: [seaweed-volume-2-data:/data]
    depends_on:
      seaweed-master: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 512M

  seaweed-filer:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:8333:8333"]
    entrypoint: ["/bin/sh", "/scripts/start-filer.sh"]
    volumes:
      - seaweed-filer-data:/data
      - ./infra/seaweedfs/start-filer.sh:/scripts/start-filer.sh:ro
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY}
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY}
      S3_PIPELINE_ACCESS_KEY: ${S3_PIPELINE_ACCESS_KEY}
      S3_PIPELINE_SECRET_KEY: ${S3_PIPELINE_SECRET_KEY}
      S3_ML_ACCESS_KEY: ${S3_ML_ACCESS_KEY}
      S3_ML_SECRET_KEY: ${S3_ML_SECRET_KEY}
    depends_on:
      seaweed-volume-1: {condition: service_started}
      seaweed-volume-2: {condition: service_started}
    deploy:
      resources:
        limits:
          # Passerelle S3 + chiffrement : les lectures parallèles de gros fichiers Parquet
          # saturaient 768 Mo (redémarrage du filer pendant la couche silver, 15/09/2026).
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  seaweed-init:
    image: chrislusf/seaweedfs:4.47
    networks: [ondine]
    restart: "no"
    depends_on:
      seaweed-filer: {condition: service_healthy}
    volumes: ["./infra/seaweedfs/create-buckets.sh:/create-buckets.sh:ro"]
    entrypoint: ["/bin/sh", "/create-buckets.sh"]

  # ---------------------------------------------------------------- PostgreSQL (données opérationnelles, audit, gouvernance)
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ondine
      # Mots de passe hachés en SCRAM-SHA-256 ; sommes de contrôle pour détecter la corruption.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      PG_INGESTION_PASSWORD: ${PG_INGESTION_PASSWORD}
      PG_API_PASSWORD: ${PG_API_PASSWORD}
      PG_ANALYST_PASSWORD: ${PG_ANALYST_PASSWORD}
      PG_AIRFLOW_PASSWORD: ${PG_AIRFLOW_PASSWORD}
      PG_MLFLOW_PASSWORD: ${PG_MLFLOW_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ondine"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrations du schéma (idempotent) : appliquées à chaque démarrage, y compris sur une base existante.
  db-migrate:
    image: postgres:17.11-alpine
    networks: [ondine]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - ./infra/postgres/migrate.sh:/migrate.sh:ro
      - ./infra/postgres/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]

  postgres-backup:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      BACKUP_RETENTION_DAYS: 7
      BACKUP_INTERVAL_S: 86400
    volumes:
      - ./infra/postgres/backup.sh:/backup.sh:ro
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

  # ---------------------------------------------------------------- Supervision
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  # Reçoit les métriques des traitements batch (trop courts pour être interrogés par Prometheus).
  pushgateway:
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:9091:9091"]
    command: ["--persistence.file=/data/metrics", "--persistence.interval=1m"]
    volumes: [pushgateway-data:/data]
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, postgres]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Source PostgreSQL en lecture seule (indicateurs métier, registre, gouvernance).
      PG_ANALYST_PASSWORD: ${PG_ANALYST_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------- Pipelines (ligne de commande, profil à la demande)
  pipelines-cli:
    build: {context: ., dockerfile: pipelines/Dockerfile}
    image: ondine/pipelines:local
    profiles: [pipelines]
    restart: "no"
    networks: [ondine]
    entrypoint: ["ondine-pipelines"]
    command: ["ingest", "--dataset", "all"]
    volumes: ["./data:/data"]
    environment: &pipeline-env
      LANDING_ROOT: /data/landing
      LAKE_ROOT: s3
      S3_ENDPOINT: seaweed-filer:8333
      S3_PIPELINE_ACCESS_KEY: ${S3_PIPELINE_ACCESS_KEY}
      S3_PIPELINE_SECRET_KEY: ${S3_PIPELINE_SECRET_KEY}
      PIPELINE_PG_DSN: postgresql://ingestion_app:${PG_INGESTION_PASSWORD}@postgres:5432/ondine
      PSEUDONYMISATION_KEY: ${PSEUDONYMISATION_KEY}
      PUSHGATEWAY_URL: pushgateway:9091
      DUCKDB_THREADS: "4"
      DUCKDB_MEMORY_LIMIT: 6GB
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_SERVICE_USER}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_SERVICE_PASSWORD}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      seaweed-init: {condition: service_completed_successfully}
    deploy:
      resources:
        limits:
          memory: 8G

  # ---------------------------------------------------------------- Ingestion en flux Kafka -> bronze (profil stream)
  # 2 répliques dans le même groupe de consommateurs : les partitions sont réparties entre
  # elles ; si l'une s'arrête, l'autre reprend ses partitions au dernier offset validé.
  stream-ingest:
    build: {context: ., dockerfile: pipelines/Dockerfile}
    image: ondine/pipelines:local
    profiles: [stream]
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    entrypoint: ["ondine-pipelines"]
    command: ["stream"]
    environment:
      <<: *pipeline-env
      KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      STREAM_GROUP_ID: bronze-ingestion
      STREAM_FLUSH_INTERVAL_S: "60"
      STREAM_MAX_BATCH: "50000"
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: 600MB
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      db-migrate: {condition: service_completed_successfully}
      seaweed-init: {condition: service_completed_successfully}
    # Laisse le temps d'écrire et de valider les lots en cours à l'arrêt.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------- Suivi des modèles (MLflow)
  # Expériences, métriques, artefacts et registre des modèles. Les artefacts transitent par le
  # serveur (--serve-artifacts) : lui seul détient une clé S3.
  mlflow:
    build: ./infra/mlflow
    image: ondine/mlflow:local
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:5001:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      seaweed-init: {condition: service_completed_successfully}
    environment:
      PG_MLFLOW_PASSWORD: ${PG_MLFLOW_PASSWORD}
      MLFLOW_ADMIN_USER: ${MLFLOW_ADMIN_USER}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${S3_ML_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_ML_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://seaweed-filer:8333
    entrypoint: ["/bin/sh", "/start.sh"]
    volumes:
      - ./infra/mlflow/start.sh:/start.sh:ro
      - mlflow-auth:/home/mlflow/auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          # 2 processus de service : ~600 Mo chacun au chargement de MLflow.
          memory: 2G

  # Compte de service des traitements : les DAG et la ligne de commande n'utilisent pas
  # l'administrateur (réservé aux personnes, via l'interface web).
  mlflow-init:
    image: ondine/mlflow:local
    restart: "no"
    networks: [ondine]
    # Le script attend lui-même que le serveur réponde : on ne dépend pas de son état de
    # santé, sinon la commande échoue quand le serveur vient juste de démarrer.
    depends_on:
      mlflow: {condition: service_started}
    environment:
      MLFLOW_URL: http://mlflow:5000
      MLFLOW_ADMIN_USER: ${MLFLOW_ADMIN_USER}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      MLFLOW_SERVICE_USER: ${MLFLOW_SERVICE_USER}
      MLFLOW_SERVICE_PASSWORD: ${MLFLOW_SERVICE_PASSWORD}
    entrypoint: ["python", "/create_service_user.py"]
    volumes: ["./infra/mlflow/create_service_user.py:/create_service_user.py:ro"]

  # ---------------------------------------------------------------- Modèle (ligne de commande, profil à la demande)
  ml-cli:
    build: {context: ., dockerfile: pipelines/Dockerfile}
    image: ondine/pipelines:local
    profiles: [ml]
    restart: "no"
    networks: [ondine]
    entrypoint: ["ondine-ml"]
    command: ["train"]
    environment:
      <<: *pipeline-env
      # Découpage temporel par défaut : 8 mois d'entraînement, 1 de validation, 3 de test.
      ONDINE_ML_TRAIN: "2025-01..2025-08"
      ONDINE_ML_VALID: "2025-09..2025-09"
      ONDINE_ML_TEST: "2025-10..2025-12"
      # Validation et test sont lus par lots : DuckDB n'a jamais besoin de plus, et le reste
      # de la mémoire du conteneur revient à l'entraînement.
      DUCKDB_MEMORY_LIMIT: 2GB
    depends_on:
      mlflow-init: {condition: service_completed_successfully}
    deploy:
      resources:
        limits:
          # Plafond volontairement inférieur à la mémoire mesurée disponible : si un
          # entraînement dérape, Docker arrête *ce* conteneur au lieu de laisser la machine
          # hôte s'effondrer. L'échec est alors lisible (code 137) au lieu d'être une panne.
          memory: 8G

  # ------------------------------------------------- API de scoring temps réel (profil api)
  # Magasin de variables en ligne : l'historique glissant (carte, client, appareil,
  # bénéficiaire) dont l'API a besoin pour décider en moins de 100 ms. Redis est un cache
  # reconstructible à partir du flux Kafka, mais il est tout de même persisté : un redémarrage
  # ne fait pas repartir la détection avec un historique vide.
  redis:
    image: redis:8.2.3-alpine
    profiles: [api]
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    # Dimensionnement : le magasin conserve 30 jours d'historique client et de carte, plus
    # 8 jours d'événements. À 4,6 millions de transactions par mois, cela représente environ
    # 9 millions d'entrées et 1,5 Gio ; 3 Gio laissent la marge nécessaire aux pics.
    # `noeviction` est délibéré : perdre silencieusement de l'historique fausserait les
    # variables du modèle sans que rien ne le signale. Mieux vaut une écriture en erreur,
    # visible, que des décisions prises sur des données amputées.
    # Aucune persistance, délibérément : le magasin en ligne est un **état dérivé**. Il se
    # reconstruit depuis le flux Kafka, qui conserve les messages, et depuis le lac. Écrire
    # un journal n'apporte donc aucune garantie — mais au redémarrage, le rejouer prend
    # plusieurs minutes et fait pointer la mémoire au-dessus de la limite du conteneur avant
    # la purge : le magasin ne redémarrait plus. Redis démarre maintenant vide en une
    # seconde, et se remplit à nouveau par le flux.
    command: >
      redis-server --appendonly no --save ""
      --maxmemory 3gb --maxmemory-policy noeviction
    healthcheck:
      # `redis-cli ping` répond aussi pendant le chargement du journal (« LOADING ») : seul
      # un vrai PONG signale un magasin utilisable. Au redémarrage, rejouer trente jours
      # d'historique prend plusieurs minutes — d'où la période de démarrage : sans elle, les
      # services qui attendent Redis abandonnent avant qu'il ait fini de charger.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 3500M

  scoring-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # Renseigné par la chaîne de livraison continue ; « inconnu » pour une construction
      # faite à la main sur un poste.
      args: {ONDINE_BUILD: "${ONDINE_BUILD:-inconnu}"}
    image: ondine/api:local
    profiles: [api]
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["8010:8000"]
    environment:
      <<: *pipeline-env
      ONDINE_API_REDIS_URL: redis://redis:6379/0
      # Compte dédié à l'API, au moindre privilège : il écrit les alertes et lit la file,
      # rien d'autre. Ni les données du lac, ni le registre des traitements.
      ONDINE_API_PG_DSN: postgresql://api_app:${PG_API_PASSWORD}@postgres:5432/ondine
      ONDINE_API_MODEL_ALIAS: champion
      ONDINE_API_LATENCY_BUDGET_MS: "100"
      # Une banque ne refuse pas tous ses paiements parce qu'un cache est tombé : en cas
      # d'incident, la décision est rendue sans historique et signalée comme dégradée.
      ONDINE_API_FAIL_OPEN: "true"
      API_WORKERS: "2"
      DUCKDB_THREADS: "1"
      DUCKDB_MEMORY_LIMIT: 512MB
    depends_on:
      redis: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      mlflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/pret', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # Alimente le magasin en ligne depuis Kafka, dans son propre groupe de consommateurs :
  # une panne ici n'affecte ni l'ingestion du lac, ni inversement.
  online-features:
    build: {context: ., dockerfile: api/Dockerfile}
    image: ondine/api:local
    profiles: [api]
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    command: ["feed"]
    environment:
      <<: *pipeline-env
      ONDINE_API_REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      ONDINE_API_CONSUMER_GROUP: online-features
      METRICS_PORT: "9109"
    depends_on:
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9109/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------- Orchestration Airflow (profil orchestration)
  # Planification et reprise automatiques de tous les traitements batch (DAG dans pipelines/dags).
  # Exécuteur local : les tâches tournent dans le conteneur du scheduler, le pool « duckdb »
  # limite les calculs simultanés à 2 pour tenir dans sa mémoire.
  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      seaweed-init: {condition: service_completed_successfully}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        airflow db migrate
        airflow pools set duckdb 2 "Calculs DuckDB simultanés (mémoire du scheduler)"
        # Comptes nominatifs : administrateur de la plateforme et consultation seule.
        airflow users list | grep -qw "$${AIRFLOW_ADMIN_USER}" || airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Plateforme --role Admin --email admin@ondine.local
        airflow users list | grep -qw analyste || airflow users create \
          --username analyste --password "$${AIRFLOW_VIEWER_PASSWORD}" \
          --firstname Analyste --lastname Fraude --role Viewer --email analyste@ondine.local
        echo "Airflow initialisé."
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_VIEWER_PASSWORD: ${AIRFLOW_VIEWER_PASSWORD}

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 10G

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------- Simulateur (profils à la demande)
  simulator-stream:
    build: ./simulator
    image: ondine/simulator:local
    profiles: [stream]
    restart: unless-stopped
    logging: *default-logging
    networks: [ondine]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN}
    command: ["stream", "--bootstrap", "kafka-1:19092,kafka-2:19092,kafka-3:19092",
              "--rate", "300", "--metrics-port", "8000"]
    deploy:
      resources:
        limits:
          memory: 1G

  simulator-batch:
    build: ./simulator
    image: ondine/simulator:local
    profiles: [generate]
    restart: "no"
    networks: [ondine]
    volumes: ["./data:/data"]
    command: ["batch", "--preset", "full", "--output", "/data/landing", "--workers", "4"]
    deploy:
      resources:
        limits:
          memory: 12G

  # ------------------------------------------- Tests automatisés (profil ci, chaîne GitHub)
  # Une base jetable, en mémoire : les tests créent et suppriment des bases entières, ils ne
  # doivent jamais le faire sur l'instance qui porte les données de production.
  postgres-ci:
    image: postgres:17.11-alpine
    profiles: [ci]
    restart: "no"
    networks: [ondine]
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: postgres
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Les tests tournent sur l'image des traitements : mêmes versions de bibliothèques qu'en
  # production, ce qu'un environnement Python reconstruit sur la machine d'intégration ne
  # garantirait pas.
  tests:
    build:
      context: .
      dockerfile: infra/ci/Dockerfile
      args: {BASE: "ondine/pipelines:local"}
    image: ondine/tests:local
    profiles: [ci]
    restart: "no"
    networks: [ondine]
    environment:
      TEST_PG_ADMIN_DSN: postgresql://ci:ci@postgres-ci:5432/postgres
      PSEUDONYMISATION_KEY: cle-de-test-ci
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: 2GB
    volumes: ["./:/depot"]
    depends_on:
      postgres-ci: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 6G

networks:
  ondine:
    name: ondine

volumes:
  mlflow-auth:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  seaweed-master-data:
  seaweed-volume-1-data:
  seaweed-volume-2-data:
  seaweed-filer-data:
  postgres-data:
  postgres-backups:
  prometheus-data:
  pushgateway-data:
  grafana-data:
  airflow-logs:
