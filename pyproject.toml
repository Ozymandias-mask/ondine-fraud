# Configuration des outils qualité partagée par tous les modules du dépôt.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W : PEP 8, F : erreurs Pyflakes, I : ordre des imports, N : nommage PEP 8,
# B : bugs probables, UP : syntaxe moderne, S : sécurité (Bandit), D : docstrings.
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "D"]
ignore = [
    "D203", "D213",  # conventions de docstring incompatibles entre elles
    "S311",          # random non cryptographique : voulu pour de la simulation
    "D401",          # « mode impératif » : règle pensée pour l'anglais, docstrings en français
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S310", "S608", "D", "E501"]
# Requêtes DuckDB construites à partir de constantes internes et de littéraux échappés
# (lake.sql_literal) : aucune donnée utilisateur n'est concaténée dans le SQL.
"pipelines/src/**" = ["S608"]
"ml/src/**" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["simulator/tests", "pipelines/tests", "ml/tests"]
addopts = "-q"
