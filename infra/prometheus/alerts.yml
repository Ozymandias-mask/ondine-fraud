# Règles d'alerte : visibles dans Prometheus (onglet Alerts) et Grafana.
groups:
  - name: plateforme
    rules:
      - alert: ComposantIndisponible
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) ne répond plus"
          description: "La cible n'est plus joignable depuis 1 minute."

      - alert: StockageRedondancePerdue
        expr: count(up{job="seaweedfs", component="volume"} == 1) < 2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Un serveur de volumes S3 est arrêté : les données ne sont plus répliquées"

  - name: flux
    rules:
      - alert: EchecsLivraisonKafka
        expr: sum(rate(sim_delivery_errors_total[5m])) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Des messages ne sont plus livrés à Kafka"

      - alert: DebitInferieurALaCible
        expr: sim_actual_rate_tps < 0.8 * sim_target_rate_tps
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Débit envoyé inférieur à 80 % de la cible ({{ $value | humanize }} tx/s)"

      - alert: LatenceLivraisonElevee
        expr: histogram_quantile(0.95, sum by (le) (rate(sim_delivery_latency_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Latence d'acquittement Kafka p95 > 500 ms"

  - name: ingestion-flux
    rules:
      - alert: ConsommateurFluxManquant
        expr: count(up{job="stream-ingest"} == 1) < 2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Moins de 2 consommateurs Kafka -> bronze actifs : plus de redondance"

      - alert: RetardIngestionFlux
        expr: sum by (topic) (stream_consumer_lag_messages) > 100000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.topic }} : {{ $value | humanize }} messages en attente d'ingestion"

      - alert: IngestionFluxBloquee
        expr: >
          (time() - max(stream_last_commit_timestamp_seconds) > 300)
          and on() (sum(rate(stream_messages_consumed_total[5m])) > 0)
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Messages lus mais aucun lot validé en bronze depuis 5 minutes"

      - alert: MessagesInvalidesEnErreur
        expr: sum by (topic, reason) (increase(stream_messages_invalid_total[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.topic }} : messages invalides ({{ $labels.reason }}) envoyés au topic d'erreurs"

      - alert: LatenceIngestionFluxElevee
        expr: histogram_quantile(0.95, sum by (le) (rate(stream_ingestion_latency_seconds_bucket[10m]))) > 180
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Délai Kafka -> bronze p95 > 3 min"
