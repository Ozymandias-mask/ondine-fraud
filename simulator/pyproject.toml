[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ondine-sim"
version = "1.0.0"
description = "Simulateur de données bancaires fictives (transactions, événements, fraudes) pour Ondine Bank"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=18",
    "faker>=30",
    "orjson>=3.10",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
ondine-sim = "ondine_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
